<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <script>
      // Apply the saved theme before anything paints so the app never flashes
      // the default theme on startup. Mirrors src/hooks/useTheme.ts.
      (function () {
        try {
          var family = "legacy";
          var mode = "dark";
          var raw = localStorage.getItem("ckourse-theme");
          var hasStored = raw !== null;
          if (raw) {
            try {
              var p = JSON.parse(raw);
              if (
                p &&
                typeof p === "object" &&
                (p.family === "legacy" ||
                  // Migrate the pre-rename "default" value.
                  p.family === "default" ||
                  p.family === "gnome" ||
                  p.family === "classic")
              ) {
                family = p.family === "default" ? "legacy" : p.family;
              }
              if (p && typeof p === "object" && (p.mode === "light" || p.mode === "dark")) {
                mode = p.mode;
              }
            } catch (e) {
              // Legacy single-string format
              if (raw === "gnome" || raw === "gnome-dark") family = "gnome";
              mode = raw === "light" || raw === "gnome" ? "light" : "dark";
            }
          }
          var cl = document.documentElement.classList;
          if (!hasStored) {
            // Fresh install: classic is the default family.
            family = "classic";
          }
          cl.remove("light", "dark", "gnome", "classic");
          if (family !== "legacy") cl.add(family);
          cl.add(mode);
        } catch (e) {
          // localStorage unavailable — defaults stay
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
